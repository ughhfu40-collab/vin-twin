services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VIN_STATE_PATH: /app/runtime/snapshots.sqlite3
    volumes:
      - vin-state:/app/runtime
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vin-state:
